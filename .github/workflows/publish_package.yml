name: Publish Package

# Publishes views-baseline to PyPI when a GitHub Release is published
# (create a Release from a vX.Y.Z tag). Auth is PyPI Trusted Publishing (OIDC) —
# no stored API token. See docs/guides/publishing-to-pypi.md.
#
# One-time PyPI setup (already done for this project — kept for reference when
# bootstrapping a NEW package: a *pending* publisher covers the first-ever release):
#   Publisher: GitHub  |  Owner: views-platform  |  Repo: views-baseline
#   Workflow:  publish_package.yml  |  Environment: (leave blank)
#
# NOTE: views-pipeline-core (>=3.0.0) reached PyPI on 2026-08-03 and is now at 3.2.0,
# so `pip install views-baseline` resolves. 1.0.0 and 1.0.1 were published while it did
# not, and were installable in name only. 1.0.2 is therefore the FIRST release whose
# clean-room install-back can actually be exercised — do it (docs/guides/publishing-to-pypi.md
# §A). This note said the opposite until 2026-09-09; it was the third copy of that claim
# and the one the doc sweep missed.

on:
  release:
    types: [published]
  workflow_dispatch:   # manual trigger (still publishes the committed version)

permissions:
  contents: read
  id-token: write      # REQUIRED: mints the OIDC token for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"   # the wheel is pure-Python (py3-none-any)

      - name: Guard — pyproject version must be newer than what's on PyPI
        run: |
          uv run --no-project --python 3.11 --with packaging python - <<'PY'
          import json, tomllib, urllib.request
          from packaging.version import parse
          new = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          try:
              cur = json.load(urllib.request.urlopen(
                  "https://pypi.org/pypi/views-baseline/json"))["info"]["version"]
          except Exception:
              cur = "0.0.0"
          assert parse(new) > parse(cur), (
              f"pyproject version {new} must be > current PyPI {cur} — bump it before releasing"
          )
          print(f"version guard OK: {new} > {cur}")
          PY

      - name: Build (hatchling, via uv)
        run: uv build

      - name: Publish to PyPI (Trusted Publishing — no token)
        run: uv publish --trusted-publishing always
