[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "views-baseline"
version = "1.0.0"
description = "VIEWS conflict-forecasting baseline models — point (Zero/LOCF/Average) and distributional (conflictology, mixture, parametric) baselines that emit views-frames PredictionFrames."
authors = [
    { name = "Sonja Häffner", email = "sonhaf@prio.org" },
    { name = "Simon Polichinel von der Maase", email = "simmaa@prio.org" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
# License is declared via the SPDX `license` expression above (PEP 639); the deprecated
# `License ::` classifier is intentionally omitted to avoid the expression/classifier clash.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # numpy is a direct runtime dependency (np.random.default_rng / Generator across the
    # model layer), not merely transitive via views-frames — declared explicitly, matching
    # the sibling house style (views-frames, views-datafactory). The golden tests
    # (tests/test_golden.py) pin numpy's gamma/poisson/choice Generator streams; the <3
    # ceiling matches siblings and those streams are stream-stable (NEP-19), see C-30.
    "numpy>=1.26,<3",
    # views-frames is the canonical home of PredictionFrame / SpatioTemporalIndex /
    # SpatialLevel, constructed at the single seam in model/frames/output.py (ADR-020).
    "views-frames>=1.3.0,<2.0.0",
    # Requires the views-frames re-export of PredictionFrame, which lands in
    # views-pipeline-core 3.0.0 (#188 / PR #206). The suite asserts isinstance against
    # that re-exported leaf, so 2.x (old local PredictionFrame) is not compatible.
    "views-pipeline-core>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/views-platform/views-baseline"
Repository = "https://github.com/views-platform/views-baseline"
Changelog = "https://github.com/views-platform/views-baseline/releases"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["views_baseline"]

[tool.hatch.build.targets.sdist]
include = ["/views_baseline"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
