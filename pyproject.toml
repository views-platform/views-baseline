[tool.poetry]
name = "views-baseline"
version = "0.1.0"
description = ""
authors = [
    "Sonja Häffner <sonhaf@prio.org>",
    "Simon Polichinel von der Maase <simmaa@prio.org>"
]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
# views-frames is the canonical home of PredictionFrame / SpatioTemporalIndex /
# SpatialLevel, constructed at the single seam in model/helpers.py (ADR-020).
views-frames = ">=1.3.0,<2.0.0"
# Requires the views-frames re-export of PredictionFrame, which lands in
# views-pipeline-core 3.0.0 (#188 / PR #206). The suite asserts isinstance against
# that re-exported leaf, so 2.x (old local PredictionFrame) is not compatible.
views-pipeline-core = ">=3.0.0,<4.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
